name: Deploy

# The unit, the user and the nginx routes live in the NixOS repo
# (nix/modules/nixos/vps-ask-api.nix). This workflow only ships code and
# flips the release symlink; Python and its dependencies come from the Nix
# closure, so there is no venv/pip step on the VPS.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt flake8

      - name: Typecheck / lint
        run: |
          python -m py_compile main.py retrieval.py
          python -m flake8 main.py retrieval.py || true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload release
        run: |
          ssh "root@$VPS_HOST" 'mkdir -p /srv/ask-api/releases'
          # Each commit lands in its own release directory, so a half-finished
          # upload never replaces the running code.
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.env.*' \
            ./ "root@$VPS_HOST:/srv/ask-api/releases/${{ github.sha }}/"

      # The symlink flip is atomic: the unit keeps serving the old release
      # until the new one is in place. If anything after the flip fails, the
      # previous release is restored and the job exits red.
      - name: Activate release
        run: |
          ssh "root@$VPS_HOST" "SHA=${{ github.sha }} bash -s" <<'REMOTE'
          set -Eeuo pipefail

          release="/srv/ask-api/releases/$SHA"
          prev="$(readlink -f /srv/ask-api/current || true)"

          rollback() {
            if [ -n "$prev" ] && [ "$prev" != "$release" ]; then
              echo "rolling back to $prev"
              ln -sfn "$prev" /srv/ask-api/current.new
              mv -Tf /srv/ask-api/current.new /srv/ask-api/current
              systemctl restart ask-api || true
            fi
          }
          trap rollback ERR

          ln -sfn "$release" /srv/ask-api/current.new
          mv -Tf /srv/ask-api/current.new /srv/ask-api/current

          # Clean up a process left behind by the old /var/www deploy.
          pkill -f 'uvicorn main:app' 2>/dev/null || true

          systemctl restart ask-api

          curl -fsS --retry 15 --retry-delay 2 --retry-connrefused \
            http://127.0.0.1:8080/health >/dev/null

          trap - ERR

          # Keep the three newest releases; current is always the newest.
          ls -1dt /srv/ask-api/releases/*/ | tail -n +4 | xargs -r rm -rf
          REMOTE
