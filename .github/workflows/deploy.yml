name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Typecheck / lint
        run: |
          python -m py_compile main.py retrieval.py
          python -m flake8 main.py retrieval.py || true

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Upload code to VPS
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.git/' \
            --exclude='.github/' \
            . "root@${{ secrets.VPS_HOST }}:/var/www/arifinoid/personal-ask-backend/"

      - name: Install Python dependencies on VPS
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" '
            set -eu
            cd /var/www/arifinoid/personal-ask-backend
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          '

      - name: Restart ask-api service
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" 'systemctl restart ask-api'

      - name: Verify deployment
        run: |
          sleep 3
          ssh "root@${{ secrets.VPS_HOST }}" 'systemctl is-active ask-api'
          curl -s "http://${{ secrets.VPS_HOST }}:8080/health" || true
