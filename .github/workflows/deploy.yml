name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Typecheck / lint
        run: |
          python -m py_compile main.py retrieval.py
          python -m flake8 main.py retrieval.py || true

      - name: Configure SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Scan VPS host keys
        run: |
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Upload code to VPS
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.git/' \
            --exclude='.github/' \
            . "root@${{ secrets.VPS_HOST }}:/var/www/arifinoid/personal-ask-backend/"
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Install Python dependencies on VPS
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" '
            set -eu
            cd /var/www/arifinoid/personal-ask-backend
            python3 -m venv .venv
            source .venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
          '
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Create systemd service if missing
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" '
            set -eu
            if [ ! -f /etc/systemd/system/ask-api.service ]; then
              cat > /etc/systemd/system/ask-api.service <<'"'"'SERVICE_EOF'"'"'
[Unit]
Description=ask.arifinoid.web.id FastAPI service
After=network.target

[Service]
Type=simple
User=root
WorkingDirectory=/var/www/arifinoid/personal-ask-backend
EnvironmentFile=/var/www/arifinoid/personal-ask-backend/.env
ExecStart=/var/www/arifinoid/personal-ask-backend/.venv/bin/uvicorn main:app --host 127.0.0.1 --port 8080
Restart=always

[Install]
WantedBy=multi-user.target
SERVICE_EOF
              systemctl daemon-reload
              systemctl enable ask-api
            fi
          '
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Restart ask-api service
        run: |
          ssh "root@${{ secrets.VPS_HOST }}" 'systemctl restart ask-api'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}

      - name: Verify deployment
        run: |
          sleep 3
          ssh "root@${{ secrets.VPS_HOST }}" 'systemctl is-active ask-api'
          curl -s "http://${{ secrets.VPS_HOST }}:8080/health" || true
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
